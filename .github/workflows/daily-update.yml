name: Daily Opera Schedule Auto-Updater

on:
  push:
    branches: [main]
  schedule:
    # 每天台灣時間早上 7 點（UTC 23:00）自動執行更新
    - cron: '0 23 * * *'
  workflow_dispatch: # 支援手動一鍵觸發
    inputs:
      deploy_only:
        description: '只重新部署 main 最新（不跑更新器）；巡檢發布失敗時自動補救用'
        type: boolean
        default: false

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions: {}

jobs:
  update-schedule:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 設定 Python 環境
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # 只改資料檔的推送（巡檢資料、報告）與「只重新部署」不跑單元測試：
      # 程式在合併時已測過，資料上線不能被程式測試偶發失敗擋住（2026-10-29 事故）
      - name: 判斷這次是否改到程式
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
        run: |
          code=true
          if [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" HEAD | grep -qvE '^(data/|patrol_runs/|docs/patrols/)'; then
              code=false
            fi
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$DEPLOY_ONLY" = "true" ]; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "改到程式：$code"

      - name: 執行更新器單元測試
        if: steps.scope.outputs.code == 'true'
        run: python -m unittest -v

      - name: 執行每日排程更新腳本
        if: github.event_name != 'push' && !inputs.deploy_only
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python updater.py

      - name: 提交並推送更新資料
        if: github.event_name != 'push' && !inputs.deploy_only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git add data/metadata.json
          git add data/threads_candidates.json
          git add data/moc_candidates.json
          git add data/moc_records.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto): 每日更新戲曲演出資料 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 組合公開網站檔案白名單
        run: |
          mkdir -p _site/data _site/assets
          install -m 0644 index.html _site/index.html
          install -m 0644 assets/app.css _site/assets/app.css
          install -m 0644 assets/app.js _site/assets/app.js
          install -m 0644 assets/favicon.svg _site/assets/favicon.svg
          install -m 0644 data/schedule.json _site/data/schedule.json
          install -m 0644 data/metadata.json _site/data/metadata.json
          install -m 0644 data/patrol_status.json _site/data/patrol_status.json
          find _site -type f -print | sort

      - name: 上傳 GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

  deploy:
    needs: update-schedule
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  patrol-health:
    needs: deploy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: 檢查巡檢健康狀態
        run: |
          python3 -c "
          import json, sys
          from datetime import datetime, timezone, timedelta

          with open('data/patrol_status.json', 'r', encoding='utf-8') as f:
              status = json.load(f)

          time_str = status.get('startedAt')
          if not time_str:
              print('錯誤：patrol_status.json 內無 startedAt', file=sys.stderr)
              sys.exit(1)

          # 每天 03:00 巡檢、07:00 檢查：今天（台北）沒有開始過的巡檢就算漏跑
          taipei = timezone(timedelta(hours=8))
          started_day = datetime.fromisoformat(time_str).astimezone(taipei).date()
          today = datetime.now(taipei).date()

          counts = status.get('counts', {})
          failed_count = counts.get('failed', 0)

          errors = []
          if started_day != today:
              errors.append(f'今天（台北 {today}）沒有巡檢紀錄：最後一次開始於 {time_str}')
          if failed_count >= 5:
              errors.append(f'巡檢失敗來源過多：failed = {failed_count}（>= 5）')

          if errors:
              for err in errors:
                  print(f'PATROL HEALTH ERROR: {err}', file=sys.stderr)
              sys.exit(1)

          print(f'巡檢健康檢查通過：今天 {today} 已巡檢（開始於 {time_str}），failed={failed_count}')
          "
