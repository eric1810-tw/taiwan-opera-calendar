name: Daily Opera Schedule Auto-Updater

on:
  push:
    branches: [main]
  schedule:
    # 每天台灣時間早上 7 點（UTC 23:00）自動執行更新
    - cron: '0 23 * * *'
  workflow_dispatch: # 支援手動一鍵觸發

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions: {}

jobs:
  update-schedule:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 設定 Python 環境
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: 執行更新器單元測試
        run: python -m unittest -v

      - name: 執行每日排程更新腳本
        if: github.event_name != 'push'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python updater.py

      - name: 提交並推送更新資料
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git add data/metadata.json
          git add data/threads_candidates.json
          git add data/moc_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto): 每日更新戲曲演出資料 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 組合公開網站檔案白名單
        run: |
          mkdir -p _site/data _site/assets
          install -m 0644 index.html _site/index.html
          install -m 0644 assets/app.css _site/assets/app.css
          install -m 0644 assets/app.js _site/assets/app.js
          install -m 0644 assets/favicon.svg _site/assets/favicon.svg
          install -m 0644 data/schedule.json _site/data/schedule.json
          install -m 0644 data/metadata.json _site/data/metadata.json
          install -m 0644 data/patrol_status.json _site/data/patrol_status.json
          find _site -type f -print | sort

      - name: 上傳 GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

  deploy:
    needs: update-schedule
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
