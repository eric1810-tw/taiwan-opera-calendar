name: Daily Opera Schedule Auto-Updater

on:
  push:
    branches: [main]
  schedule:
    # 每天台灣時間早上 7 點（UTC 23:00）自動執行更新
    - cron: '0 23 * * *'
  workflow_dispatch: # 支援手動一鍵觸發

jobs:
  update-schedule:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v7

      - name: 設定 Python 環境
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 執行每日排程更新腳本
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python updater.py

      - name: 提交並推送更新資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git add data/metadata.json
          git add data/threads_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto): 每日更新戲曲演出資料 [skip ci]"
            git push
          fi

      - name: 上傳 GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: update-schedule
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
