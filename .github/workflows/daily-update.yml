name: Daily Opera Schedule Auto-Updater

on:
  schedule:
    # 每天台灣時間早上 7 點（UTC 23:00）自動執行更新
    - cron: '0 23 * * *'
  workflow_dispatch: # 支援手動一鍵觸發

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 執行每日排程更新腳本
        run: |
          python updater.py

      - name: 提交並推送更新資料
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): 每日定時更新戲曲演出行事曆 [skip ci]" && git push)

      - name: 部署至 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
  deploy:
    needs: update-schedule
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
